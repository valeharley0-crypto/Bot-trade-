  .card { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px; }

/* Remplacement de rescanLive() par une version propre */
async function rescanLive() {

    liveCandlesByTF = await fetchMultiTF();

    checkNewEntries(allSim);

    renderSignal(signals);
  } catch (e) {
    document.getElementById('signalBox').innerHTML = `<div class="empty">Erreur API : ${e.message}</div>`;

}

let synWS = null;

function synDerivConnect() {
  return new Promise((resolve, reject) => {
    if (synWS && synWS.readyState === 1) { resolve(synWS); return; }
    const ws = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=1089`);
    ws.onopen = () => { synWS = ws; resolve(ws); };
    ws.onerror = e => reject(e);
  });
}
